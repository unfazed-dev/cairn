[package]
name = "cairn-tauri"
# tauri-plugin 2.6+ requires `links` == package.name so its build script can
# associate the generated permission artifacts with this crate.
links = "cairn-tauri"
version = "0.1.0"
edition = "2021"
publish = false
description = "Tauri 2 plugin exposing cairn-client's SyncClient<SqliteStorage> to desktop web apps (feasibility scaffold)."
license = "Apache-2.0"
repository = "https://github.com/cairn-sync/cairn"
homepage = "https://cairn.dev"

[lib]
crate-type = ["lib"]

# -----------------------------------------------------------------------------
# Standalone workspace (mirrors sdk/cairn_flutter/rust/Cargo.toml +
# sdk/cairn_node/Cargo.toml): detaches this crate from the root cairn
# Cargo.toml so the root `make ci` gate is not entangled with an experimental
# Tauri scaffold. The root workspace already forbids hand-written `unsafe`
# workspace-wide; this crate keeps `#![forbid(unsafe_code)]` — the forbid
# applies to THIS crate's source, not its dependencies', so tauri's internal
# FFI is unaffected.
# -----------------------------------------------------------------------------
[workspace]

[dependencies]
# Path deps — same shape as sdk/cairn_flutter/rust/Cargo.toml (this crate lives
# at sdk/cairn_tauri/, so the crates are three levels up). cairn-core is
# required transitively: PendingWrite / WriteOp live there, and cairn-client
# re-exports neither. cairn-domain is required for the Lsn accessor in
# checkpoint().
cairn-client = { path = "../../crates/cairn-client" }
cairn-core = { path = "../../crates/cairn-core" }
cairn-domain = { path = "../../crates/cairn-domain" }

tauri = "2"
serde_json = "1.0"
tokio = { version = "1.39", features = ["rt-multi-thread", "sync", "macros"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dev-dependencies]
# `process` (spawning the spine binary), `io-util` (TCP read_to_end/write_all),
# `net` (TcpStream for the raw HTTP/1.1 /push), `time` (poll deadline) — the
# live-E2E test's harness needs these beyond the runtime features the lib uses.
tokio = { version = "1.39", features = ["rt-multi-thread", "sync", "macros", "test-util", "process", "io-util", "net", "time"] }

[profile.release]
# Smaller artifacts for the plugin .so/.dll; lto is off by default to keep the
# scaffolding link fast (this is a feasibility build, not a shipped binary).
lto = false
