# =============================================================================
# uniffi-bindgen-cs configuration for cairn-dotnet.
# -----------------------------------------------------------------------------
# cairn_swift and cairn_kotlin do NOT ship a uniffi.toml — the proc-macro path
# (`setup_scaffolding!`) sets the namespace inline and the official
# `uniffi-bindgen-cli` needs no extra config for Swift/Kotlin output. cairn_dotnet
# ships one because the Nord `uniffi-bindgen-cs` reads this file for output
# configuration. The namespace here is advisory: the Nord bindgen prefixes the
# crate namespace (set by `setup_scaffolding!("cairn")` in src/lib.rs) with
# `uniffi.`, producing the final C# namespace `uniffi.cairn`. The committed
# output lands in dotnet/generated/cairn.cs (filename matches the namespace).
# =============================================================================
[bindings.cs]
# C# namespace — the Nord bindgen wraps this as `uniffi.<namespace>`, so the
# final emitted namespace is `uniffi.cairn`. (The value here matches the
# `setup_scaffolding!("cairn")` arg in src/lib.rs; they MUST agree.)
namespace = "cairn"
# Width of the generated C# — keep it readable for reviewers (the committed
# dotnet/generated/cairn.cs is the visible artifact).
width = 100
