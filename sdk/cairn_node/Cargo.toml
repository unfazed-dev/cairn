[package]
name = "cairn_node"
version = "0.1.0"
license = "Apache-2.0"
repository = "https://github.com/unfazed-dev/cairn"
homepage = "https://github.com/unfazed-dev/cairn"  # CAIRN-IDENTITY-PENDING
description = "napi-rs bridge exposing cairn-client SyncClient<SqliteStorage> to Node.js."
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

# Standalone workspace (mirrors sdk/cairn_flutter/rust/Cargo.toml): detaches
# this crate from the root cairn Cargo.toml so the root `make ci` gate is not
# entangled with an experimental napi scaffold. The root workspace already
# forbids `unsafe`; the napi-derive macro is the machine-generated FFI glue
# exception (ADR-0015 addendum) — see lib.rs ponytail.
[workspace]

[dependencies]
napi = { version = "2", features = ["tokio_rt"] }
napi-derive = "2"

# Path deps — same shape as sdk/cairn_flutter/rust/Cargo.toml (this crate lives
# at sdk/cairn_node/, so the crates are three levels up).
cairn-client = { path = "../../crates/cairn-client" }
cairn-core = { path = "../../crates/cairn-core" }
cairn-domain = { path = "../../crates/cairn-domain" }

tokio = { version = "1.39", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde_json = "1.0"
# Push-token REST (ADR-0037 §3): POST/DELETE /push-tokens. Mirrors the root
# workspace pin's posture (rustls, no default TLS stack); the `json` helper
# feature is unneeded — the body is a hand-built JSON string pinned by tests.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[build-dependencies]
napi-build = "2"

[dev-dependencies]
# Temp-FILE DB for the sign_out wipe proof (`:memory:` is fresh-each-open and
# would hide a leaked wipe — ADR-0029).
tempfile = "3"

[profile.release]
# Smaller artifacts for the napi addon; lto is off by default to keep the
# scaffolding link fast (this is a feasibility build, not a shipped binary).
opt-level = 1
