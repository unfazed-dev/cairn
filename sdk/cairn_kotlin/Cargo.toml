# =============================================================================
# cairn-kotlin — UniFFI bridge exposing cairn-client's SyncClient<SqliteStorage>
# to Kotlin (Android). Mirrors sdk/cairn_swift/Cargo.toml and (structurally)
# sdk/cairn_tauri/Cargo.toml + sdk/cairn_node/Cargo.toml.
# -----------------------------------------------------------------------------
# Standalone workspace (mirrors sdk/cairn_swift/Cargo.toml +
# sdk/cairn_flutter/rust/Cargo.toml + sdk/cairn_node/Cargo.toml +
# sdk/cairn_tauri/Cargo.toml): detaches this crate from the root cairn
# Cargo.toml so the root `make ci` gate is not entangled with an experimental
# Kotlin scaffold. The root workspace already forbids hand-written `unsafe`
# workspace-wide; this crate keeps `#![forbid(unsafe_code)]` — the forbid
# applies to THIS crate's source, not its dependencies', so UniFFI's
# macro-generated FFI glue (the ADR-0015 addendum machine-generated exception)
# is unaffected.
# -----------------------------------------------------------------------------
# Path deps — same shape as sdk/cairn_swift/Cargo.toml (this crate lives at
# sdk/cairn_kotlin/, so the crates are three levels up). cairn-core is required
# transitively: PendingWrite / WriteOp live there, and cairn-client re-exports
# neither. cairn-domain is required for the Lsn accessor in checkpoint().
# =============================================================================

[package]
name = "cairn-kotlin"
version = "0.0.0"
edition = "2021"
publish = false
description = "UniFFI bridge exposing cairn-client's SyncClient<SqliteStorage> to Kotlin (Android) — feasibility scaffold."
license = "Apache-2.0"

# Standalone workspace root — detaches from the parent cairn workspace (mirrors
# sdk/cairn_swift/Cargo.toml + sdk/cairn_tauri/Cargo.toml + sdk/cairn_node/Cargo.toml
# + sdk/cairn_flutter/rust/Cargo.toml). Required: without this, cargo walks up
# and tries to enroll cairn-kotlin as a member of /Volumes/.../cairn/Cargo.toml,
# which would entangle the root `make ci` gate with this scaffold.
[workspace]

[lib]
# cdylib: Android loads libcairn_kotlin.so via JNI (also: uniffi-bindgen reads
#         the .so to emit Kotlin bindings).
# lib:    cargo test / rust-analyzer.
# (No staticlib — Android consumes the .so packaged in the .aar's jniLibs/,
#  unlike iOS/macOS which link an .a into the app binary. Mirrors Mozilla's
#  application-services UniFFI-on-Android shape.)
name = "cairn_kotlin"
crate-type = ["cdylib", "lib"]

[dependencies]
cairn-client = { path = "../../crates/cairn-client" }
cairn-core = { path = "../../crates/cairn-core" }
cairn-domain = { path = "../../crates/cairn-domain" }

# UniFFI 0.28 — proc-macro path (setup_scaffolding! + #[derive(uniffi::Object)]
# + #[uniffi::export]). The bindgen CLI version MUST match this major.minor:
# `cargo install uniffi-bindgen-cli --version 0.28`. Verified:
#   $ uniffi-bindgen --version
#   uniffi-bindgen 0.28.3
uniffi = { version = "0.28", features = ["cli"] }

# Sync surface: each UniFFI method blocks_on the owned multi-thread runtime.
# rt-multi-thread so block_on from the foreign (Kotlin/JNI) thread doesn't
# starve the single-threaded current-thread runtime under concurrent Kotlin
# calls.
tokio = { version = "1.39", features = ["rt-multi-thread", "sync"] }
serde_json = "1.0"
# UniFFI 0.28 requires Result error types to be enum/struct derived via
# `#[derive(uniffi::Error)]`; bare `String` panics in bindgen ("unknown throw
# type: Some(String)"). `thiserror` supplies the Display + std::error::Error
# impls that UniFFI's error trait requires — cairn-client uses the same crate.
thiserror = "1.0"

[build-dependencies]
# ponytail: no build.rs today — the proc-macro path via setup_scaffolding!
# emits the FFI scaffolding at compile time, no UDL file, no build.rs. If a
# future UniFFI version reintroduces a build.rs requirement for proc-macros,
# this [build-dependencies] uniffi = { version = "0.28", features = ["build"] }
# is the one-line fix point (mirrors cairn_tauri's tauri-plugin build dep).

[profile.release]
# Smaller artifacts for the .so; lto is off by default to keep the
# scaffolding link fast (this is a feasibility build, not a shipped binary).
opt-level = 2
