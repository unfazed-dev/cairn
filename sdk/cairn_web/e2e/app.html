<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cairn Web E2E</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
  </head>
  <body>
    <h1>Cairn Web live-replication E2E</h1>
    <p id="status">Loading WASM…</p>
    <!--
      The Playwright test (`browser_live.spec.cjs`) serves this page from a
      tiny static HTTP server rooted at `sdk/cairn_web/`, with `/pkg-web/*`
      mapped to `crates/cairn-ffi-wasm/pkg-web/`. The ES module init loads
      the sibling `_bg.wasm` via `import.meta.url` — no bundler needed.
    -->
    <script type="module">
      import init, { CairnSocket } from "../pkg-web/cairn_ffi_wasm.js";
      try {
        await init();
        window.CairnSocket = CairnSocket;
        document.getElementById("status").textContent = "WASM ready.";
        console.log("[web-e2e] WASM_READY");
      } catch (e) {
        document.getElementById("status").textContent = "WASM init FAILED.";
        console.log(
          "[web-e2e] WASM_INIT_FAILED: " + ((e && e.message) || String(e)),
        );
      }
    </script>
  </body>
</html>
