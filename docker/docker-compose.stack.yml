# Cairn — full stack compose.
#
# Brings up the whole launchable product:
#   postgres     — the source DB (logical replication enabled)
#   cairn-server — the sync engine (real PgReplicator → fan-out → WebSocket)
#   cairn-cloud  — the control plane (accounts, projects, billing, admin SPA, landing)
#   cairn-pushd  — the standalone push daemon (ADR-0038; APNs/FCM/Web Push)
#
#   docker compose -f docker/docker-compose.stack.yml up --build
#
# Then:
#   Landing + admin:  http://localhost:9090        (cloud)
#   Sync WebSocket:   ws://localhost:8800/sync     (server)
#   Postgres:         localhost:5433 (cairn/cairn)
#
# First-run: visit http://localhost:9090/admin and sign up — the first account
# becomes the Founder. Stripe is optional (endpoints 503 without keys).

services:
  postgres:
    image: postgres:16-alpine
    container_name: cairn-stack-postgres
    environment:
      POSTGRES_USER: cairn
      POSTGRES_PASSWORD: cairn
      POSTGRES_DB: cairn
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=20"
      # 20 (not PG default 10): the real-PG e2e suite runs concurrent test
      # binaries, each creating a logical slot; 10 is exhausted across leaky runs.
      - "-c"
      - "max_replication_slots=20"
      - "-c"
      - "max_connections=200"
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./pg-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cairn -d cairn"]
      interval: 5s
      timeout: 3s
      retries: 20

  cairn-server:
    build:
      context: ..
      dockerfile: Dockerfile
    image: cairn:latest
    container_name: cairn-stack-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CAIRN_BIND: "0.0.0.0:8800"
      # This stack sets no CAIRN_SYNC_AUTH, so /sync is anonymous. The server
      # refuses that pair on a non-loopback bind unless told the exposure is
      # deliberate — it is here: a local demo stack on Docker's own network.
      # A real deploy sets CAIRN_SYNC_AUTH=supabase-jwt and drops this line.
      CAIRN_INSECURE_ANONYMOUS: "1"
      CAIRN_REPLICATOR: pg
      CAIRN_PG_URL: "postgresql://cairn:cairn@postgres:5432/cairn"
      CAIRN_PG_SLOT: cairn_slot
      CAIRN_PG_PUBLICATION: cairn_pub
      CAIRN_LOG: "info,cairn=debug"
      RUST_LOG: "info,cairn=debug"
    command: ["cairn-server"]
    ports:
      - "8800:8800"

  cairn-cloud:
    build:
      context: ..
      dockerfile: Dockerfile
    image: cairn:latest
    container_name: cairn-stack-cloud
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CAIRN_CLOUD_BIND: "0.0.0.0:9090"
      CAIRN_LICENSE_SECRET: "change-me-in-production"
      CAIRN_CLOUD_DB: "/data/cairn-cloud.db"
      CAIRN_CLOUD_PUBLIC_URL: "http://localhost:9090"
      # Optional — uncomment + set to enable billing:
      # STRIPE_SECRET_KEY: sk_test_...
      # STRIPE_WEBHOOK_SECRET: whsec_...
      # STRIPE_PRICE_PRO: price_...
      RUST_LOG: "info,cairn_cloud=debug"
    command: ["cairn-cloud"]
    ports:
      - "9090:9090"
    volumes:
      - cloud-data:/data

  cairn-pushd:
    build:
      context: ..
      dockerfile: Dockerfile
    image: cairn:latest
    container_name: cairn-stack-pushd
    environment:
      CAIRN_PUSHD_BIND: "0.0.0.0:8090"
      CAIRN_PUSHD_DB: "/data/cairn-pushd.db"
      # Optional (v1.1) — Postgres registry instead of the SQLite default
      # above; the image builds cairn-pushd with --features pg, so setting
      # this URL switches the registry (CAIRN_PUSHD_DB is then ignored):
      # CAIRN_PUSHD_DATABASE_URL: "postgres://cairn:cairn@postgres:5432/cairn"
      # Required — tenant:secret API-key pairs, comma-separated:
      # Keys cairn-server delegates with (CAIRN_PUSH_REMOTE_KEY) MUST carry
      # the ":rail" role suffix, e.g. "hq:delegator-key:rail".
      CAIRN_PUSHD_API_KEYS: "demo:change-me-in-production"
      # Optional rails — unset = rail off (from_env semantics, ADR-0038 §1):
      # CAIRN_FCM_CREDENTIALS_JSON: /run/secrets/fcm.json
      # CAIRN_APNS_KEY_P8: /run/secrets/apns.p8
      # CAIRN_APNS_KEY_ID: your-key-id
      # CAIRN_APNS_TEAM_ID: your-team-id
      # CAIRN_APNS_BUNDLE_ID: com.example.app
      # CAIRN_WEBPUSH_VAPID_PRIVATE_KEY: base64url-p256-scalar
      # CAIRN_WEBPUSH_VAPID_SUBJECT: mailto:ops@example.com
      RUST_LOG: "info,cairn_push=debug"
    command: ["cairn-pushd"]
    ports:
      - "8090:8090"
    volumes:
      - pushd-data:/data

volumes:
  pgdata:
  cloud-data:
  pushd-data:
