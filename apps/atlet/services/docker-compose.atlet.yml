# Local-profile cairn-server for the Atlet suite's server-mode engine. It
# points at the hosted Supabase Postgres — no local Postgres container here,
# unlike docker/docker-compose*.yml at the repo root (those are cairn's own
# e2e stack against a throwaway local Postgres; different project name and
# ports, so this stack can run alongside them without colliding).
#
# Usage:
#   cd apps/atlet/services && cp .env.example .env   # fill in real values
#   docker compose -f docker-compose.atlet.yml config -q
#   docker compose -f docker-compose.atlet.yml up -d
name: atlet-services

services:
  cairn-server:
    build:
      context: ../../..    # apps/atlet/services -> repo root
      dockerfile: Dockerfile   # repo root Dockerfile, not docker/Dockerfile (brief's draft path doesn't exist)
    environment:
      CAIRN_BIND: "0.0.0.0:8080"   # must match the ports mapping below; default is 8800
      CAIRN_REPLICATOR: pg
      CAIRN_PG_URL: ${ATLET_PG_URL}
      # The scoped publication from migration 0002_replication_publication.sql,
      # instead of the default cairn_pub (which cairn would auto-create as
      # CREATE PUBLICATION ... FOR ALL TABLES -- too broad for a shared
      # Supabase project).
      CAIRN_PG_PUBLICATION: atlet_pub
      CAIRN_PG_SLOT: atlet_cairn_slot
      CAIRN_WRITE_TABLES: ${CAIRN_WRITE_TABLES}
      # Supabase-JWT auth (ADR-0010/0011): tenant_id == JWT sub == auth.uid().
      # Atlet's sessions table scopes by user_id, not the default org_id.
      CAIRN_SYNC_AUTH: supabase-jwt
      CAIRN_TENANT_COLUMN: user_id
      CAIRN_SUPABASE_URL: ${SUPABASE_URL}
      CAIRN_SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
    ports: ["8080:8080"]
