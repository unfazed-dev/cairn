[package]
name = "cairn-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Cairn sync server binary (composition root)."
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "cairn-server"
path = "src/main.rs"

[features]
# `pg` is on by default so `cargo build -p cairn-server` includes the real
# PgReplicator. Disable it with `cargo build -p cairn-server --no-default-features`
# (the runtime default stays `CAIRN_REPLICATOR=fake`, so a featureless binary still
# runs — it just can't be switched to the real replicator).
default = ["pg"]
pg = ["cairn-infra/pg"]

[dependencies]
cairn-domain = { workspace = true }
cairn-application = { workspace = true }
cairn-infra = { workspace = true }
cairn-license = { workspace = true }

tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Task 21 admin-token gate: hash + constant-time compare CAIRN_ADMIN_TOKEN.
sha2 = { workspace = true }
subtle = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true }
# Mint HS256 JWTs in admin_auth.rs's supabase_jwt_is_not_admin test (mirrors
# crates/cairn-infra/tests/auth_sync.rs's hand-rolled mint_jwt).
hmac = { workspace = true }
# Push test doubles (push_api.rs, push_e2e_tests in main.rs): implement the
# async ports (SyncAuth/EventSink/PushSink) and build ReplicationEvent
# payloads. Mirrors the main deps the library crates already carry.
async-trait = { workspace = true }
bytes = { workspace = true }

[lints]
workspace = true
