[package]
name = "cairn-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Cairn sync server binary (composition root)."
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "cairn-server"
path = "src/main.rs"

[features]
default = []
# Forward to cairn-infra's pg feature, enabling the real PgReplicator. Build with
# `cargo build -p cairn-server --features pg` (or `--all-features`).
pg = ["cairn-infra/pg"]

[dependencies]
cairn-domain = { workspace = true }
cairn-application = { workspace = true }
cairn-infra = { workspace = true }

tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
