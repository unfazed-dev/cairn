[package]
name = "cairn-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "The `cairn` CLI — init/dev/doctor/deploy for a Postgres + Supabase sync backend."
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "cairn"
path = "src/main.rs"

[dependencies]
cairn-domain = { workspace = true }
cairn-infra = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tokio-postgres = { workspace = true }
rustls = { workspace = true }
tokio-postgres-rustls = { workspace = true }
webpki-roots = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
# Push credential validation/minting (ADR-0038 plan tasks 3.1-3.2): ES256
# APNs provider JWT + RS256 FCM assertion (from_ec_pem/from_rsa_pem, the
# exact calls the cairn-infra rails use), plus VAPID P-256 keypair mint.
jsonwebtoken = { workspace = true }
p256 = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tokio-postgres = { workspace = true }
uuid = { workspace = true }
# Mint RSA/EC test keys for the p8 + service-account validation tests
# (mirrors cairn-infra's push-rail dev-dependency set).
rsa = { workspace = true }

[lints]
workspace = true
