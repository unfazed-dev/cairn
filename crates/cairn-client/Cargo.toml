[package]
name = "cairn-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Cairn native client — SqliteStorage backend + the tokio SyncClient (connect, apply, checkpoint, reconnect)."
repository.workspace = true
homepage.workspace = true

[features]
# Pulls in cairn-infra's real Postgres logical-replication adapter for the
# `e2e_pg_sync` test only. OFF by default — mirrors cairn-infra's own `pg`
# feature (see that crate's Cargo.toml doc).
pg = ["cairn-infra/pg"]

[dependencies]
cairn-core = { workspace = true }
cairn-domain = { workspace = true }
cairn-infra = { workspace = true }   # WireFrame decode (client ↔ server contract)
rusqlite = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
cairn-core = { workspace = true }
cairn-application = { workspace = true }
cairn-infra = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
# pg-only (behind the `pg` feature above) — the e2e_pg_sync harness needs a
# control-plane SQL client (slot cleanup, direct-row assertions) and typed
# uuid binding, matching cairn-infra's own e2e_pg_* tests. The tenant-mode
# reconnect-replay e2e also needs HMAC/SHA2 to mint Supabase-shape JWTs.
tokio-postgres = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }

[lints]
workspace = true
